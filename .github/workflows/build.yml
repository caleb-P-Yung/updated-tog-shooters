name: Build Game

on: [push]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install common deps
        run: pip install PyInstaller pygame pygame-menu pygame-popup pillow

      - name: Install Linux-only deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo pip install python-xlib --break-system-packages
        
      - name: Install Windows-only deps
        if: runner.os == 'Windows'
        run: pip install pywin32

      - name: Install macOS-only deps
        if: runner.os == 'macOS'
        run: pip install pyobjc-framework-Cocoa

      - name: Build
        run: python -m PyInstaller main.spec
      - name: Upload build
        if: runner.os =='Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-build
          path: dist/**
      
